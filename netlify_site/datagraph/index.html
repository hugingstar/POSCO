<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - 껄무새 파이썬</title>
    <meta name="description" content="파이썬 기초 문법 - 함수">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <div class="container">
        <header class="text-center" style="margin-bottom: 2rem;">
            <img src="../favicon.png" alt="껄무새" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 3px solid white;">
            <h1 style="font-size: 2.2rem; margin-bottom: 0;">🦜 데이터 분석</h1>
        </header>
        
        <p class="text-center" style="margin-bottom: 2rem;">"안녕! 오늘은 파이썬의 기초인 <strong>함수와 클래스</strong>부터, 실무에서 쓰이는 <strong>데이터 분석과 가공 방법</strong>까지 모두 파헤쳐 볼 거야무새!"</p>

        <div id="mynetwork"></div>

        <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <script type="text/javascript">
            // 노드(목차 아이템) 설정
            var nodes = new vis.DataSet([
                { id: 1, label: '파이썬 함수', title: "AI에게 '이 작업 반복해서 처리해줘'라고 똑똑하게 지시하려면 꼭 필요해요!", font: {size: 22, color: '#000000', bold: true}, color: {background: '#dbeafe', border: '#000000'}, shape: 'box', margin: 15, borderWidth: 2, shadow: true, url: 'function.html' },
                { id: 2, label: '파이썬 클래스', title: "AI에게 '복잡한 시스템 구조 짜줘'라고 명령할 때 완벽한 설계도가 됩니다!", font: {size: 22, color: '#000000', bold: true}, color: {background: '#fce7f3', border: '#000000'}, shape: 'box', margin: 15, borderWidth: 2, shadow: true, url: 'class.html' },
                { id: 3, label: 'Numpy로 데이터 가공', title: "AI 모델이 이해할 수 있도록 데이터를 행렬이나 다차원 배열로 가공할 때 필수적입니다!", font: {size: 22, color: '#000000', bold: true}, color: {background: '#ffedd5', border: '#000000'}, shape: 'box', margin: 15, borderWidth: 2, shadow: true, url: 'numpy.html' }
            ]);

            // 간선(연결선) 설정
            var edges = new vis.DataSet([
                { from: 1, to: 2, arrows: 'to', color: {color:'#000000', highlight: '#000000'}, width: 2 },
                { from: 1, to: 3, arrows: 'to', color: {color:'#000000', highlight: '#000000'}, width: 2 }
            ]);

            // 네트워크 생성
            var container = document.getElementById('mynetwork');
            var data = {
                nodes: nodes,
                edges: edges
            };
            var options = {
                nodes: {
                    widthConstraint: {
                        maximum: 160
                    }
                },
                physics: {
                    barnesHut: {
                        springLength: 300,
                        springConstant: 0.04,
                        avoidOverlap: 0.5
                    }
                },
                interaction: {
                    hover: true,
                    zoomView: true
                }
            };
            var network = new vis.Network(container, data, options);

            // 클릭 이벤트 처리 (링크 이동)
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    var nodeId = params.nodes[0];
                    var clickedNode = nodes.get(nodeId);
                    if (clickedNode.url) {
                        window.location.href = clickedNode.url;
                    }
                }
            });

            // 마우스 오버 시 포인터 변경
            network.on("hoverNode", function () {
                network.canvas.body.container.style.cursor = 'pointer';
            });
            network.on("blurNode", function () {
                network.canvas.body.container.style.cursor = 'default';
            });
        </script>
        
        <div class="text-center" style="margin-top: 3rem;">
            <a href="../index.html" class="back-btn">&larr; 메인 목차로 돌아가기</a>
        </div>
    </div>
</body>
</html>
