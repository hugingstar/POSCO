<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - 껄무새 파이썬</title>
    <meta name="description" content="파이썬 기초 문법 - 함수">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <div class="container">
        <header class="text-center" style="margin-bottom: 2rem;">
            <img src="../favicon.png" alt="껄무새" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 3px solid white;">
            <h1 style="font-size: 2.2rem; margin-bottom: 0;">🦜 Day 1: 파이썬 기초</h1>
        </header>
        
        <p class="text-center" style="margin-bottom: 2rem;">"안녕! 오늘은 코드를 정리하고 재사용하는 가장 중요한 방법인 <strong>함수(Function)</strong>에 대해 배울 거야무새!"</p>

        <div id="mynetwork"></div>

        <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <script type="text/javascript">
            // 노드(목차 아이템) 설정
            var nodes = new vis.DataSet([
                { id: 1, label: 'Day 1: 파이썬 함수 알아보기\n(Click!)', font: {size: 20, color: '#ffffff', bold: true}, color: {background: '#0ea5e9', border: '#0284c7'}, shape: 'box', margin: 15, borderWidth: 2, shadow: true, url: 'function.html' }
            ]);

            // 간선(연결선) 설정
            var edges = new vis.DataSet([
            ]);

            // 네트워크 생성
            var container = document.getElementById('mynetwork');
            var data = {
                nodes: nodes,
                edges: edges
            };
            var options = {
                physics: {
                    barnesHut: {
                        springLength: 150,
                        springConstant: 0.04
                    }
                },
                interaction: {
                    hover: true,
                    zoomView: false
                }
            };
            var network = new vis.Network(container, data, options);

            // 클릭 이벤트 처리 (링크 이동)
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    var nodeId = params.nodes[0];
                    var clickedNode = nodes.get(nodeId);
                    if (clickedNode.url) {
                        window.location.href = clickedNode.url;
                    }
                }
            });

            // 마우스 오버 시 포인터 변경
            network.on("hoverNode", function () {
                network.canvas.body.container.style.cursor = 'pointer';
            });
            network.on("blurNode", function () {
                network.canvas.body.container.style.cursor = 'default';
            });
        </script>
        
        <div class="text-center" style="margin-top: 3rem;">
            <a href="../index.html" class="back-btn">&larr; 메인 목차로 돌아가기</a>
        </div>
    </div>
</body>
</html>
